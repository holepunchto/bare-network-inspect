name: "bare-network-inspect CodeQL config"

# security-extended is the suite that catches the XSS class this GUI is exposed to.
queries:
  - uses: security-extended

paths-ignore:
  # Generated: dist/ is esbuild's bundle of src/, so analysing it re-reports every finding twice.
  - "**/dist/**"
  - "**/node_modules/**"
  - "**/*.bundle.js"
  - "**/package-lock.json"
  # NOTE: packages/bare-observe/gui/index.html is deliberately NOT excluded — that is where the
  # js/xss came from, and it must never be excluded to silence a finding.
