# Publish the repo's packages (@holepunchto/bare-network-inspect) to the PUBLIC npm registry
# (registry.npmjs.org). Needs an NPM_TOKEN repo secret — an npm *automation* token, which bypasses
# 2FA in CI — with publish rights on the @holepunchto scope. The verification gate runs first: a red
# suite blocks the publish.
#
# TWO WAYS TO RELEASE:
#   1. Push a version tag (as before):
#        git tag v0.1.7 && git push origin v0.1.7
#   2. Manually from the Actions tab → "release" → "Run workflow" (workflow_dispatch):
#        pick `package` (all | bare_observe), and optionally tick `create_tag`
#        to also cut a git tag + GitHub Release from the current package.json version.
#      Use this when the version bump is already merged to main and you'd rather click a button
#      than push a tag locally.
#
# Each package publishes from its OWN package.json version, independent of any tag string.
# Publishing is IDEMPOTENT: a package whose version is already on the registry is SKIPPED, not
# failed — so releasing one package never fails on another's unchanged version, and re-running is
# safe.
#
# VERSION BUMPS HAPPEN HERE. Run the workflow with `bump` = patch | minor | major and it will bump
# packages/bare-observe/package.json, commit that to main, tag it, push both, and publish the new
# version. `bump: none` (the default) publishes whatever version main already carries, which is what
# a tag push does too. Requires main to be unprotected, or the push step will 403 — see the
# `bump` step for the alternative if that changes. A tag created here via GITHUB_TOKEN does not re-trigger the tag-push run (GitHub blocks
# recursive GITHUB_TOKEN triggers), so there's no double publish.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump to apply to main before publishing'
        type: choice
        default: none
        options:
          - none
          - patch
          - minor
          - major
      package:
        description: 'Which package to publish'
        type: choice
        default: all
        options:
          - all
          - bare_observe
      create_tag:
        description: 'Also create a git tag + GitHub Release from the current bare_observe version'
        type: boolean
        default: false
      tag:
        description: 'Tag name to create (optional; defaults to v<bare_observe version>). Only used if create_tag is ticked.'
        type: string
        default: ''

# Queue, don't cancel: a half-finished release (bumped + pushed, not published) beats a slow one.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write      # write needed only for the optional tag/release step; read would suffice otherwise

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the bump step pushes a commit + tag
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # without scope, setup-node overrides the DEFAULT registry and sends esbuild there too
          scope: '@holepunchto'

      - name: Verification gate (blocks publish if red)
        run: bash verification/run-all.sh

      # Fail on missing/bad npm auth BEFORE the bump writes a commit and a tag. Without this the
      # last run got all the way to `npm publish`, hit ENEEDAUTH, and only stopped there — with
      # `bump: patch` that would have left main bumped and tagged for a version that never shipped.
      - name: Preflight — npm auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN secret is not set. Create an npm AUTOMATION token (bypasses 2FA in CI) with publish rights on @holepunchto, then: gh secret set NPM_TOKEN"
            exit 1
          fi
          if ! who=$(npm whoami --registry=https://registry.npmjs.org 2>&1); then
            echo "::error::npm rejected the token: ${who}"
            exit 1
          fi
          echo "authenticated to npmjs as: ${who}"

      - name: Bump version on main (workflow_dispatch only)
        id: bump
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        env:
          BUMP: ${{ inputs.bump }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # A tag ref has no branch to commit to — refuse rather than commit to a detached HEAD.
          case "$REF" in
            refs/heads/*) BRANCH="${REF#refs/heads/}" ;;
            *) echo "::error::bump requires a branch ref, got $REF. Re-run this workflow from a branch (usually main)." ; exit 1 ;;
          esac

          cd packages/bare-observe
          OLD="$(node -p "require('./package.json').version")"
          # npm must not tag here; we tag after the commit so the tag points at the right commit.
          npm version "$BUMP" --no-git-tag-version >/dev/null
          NEW="$(node -p "require('./package.json').version")"
          cd - >/dev/null
          echo "$OLD -> $NEW ($BUMP)"

          if git rev-parse -q --verify "refs/tags/v$NEW" >/dev/null || git ls-remote --exit-code --tags origin "v$NEW" >/dev/null 2>&1; then
            echo "::error::tag v$NEW already exists. Someone released it already, or the bump is wrong."
            exit 1
          fi

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add packages/bare-observe/package.json packages/bare-observe/package-lock.json
          git commit -m "release: v$NEW"
          git tag -a "v$NEW" -m "v$NEW"
          # Commit first: a tag without its commit points at something nobody else has.
          git push origin "HEAD:refs/heads/$BRANCH"
          git push origin "refs/tags/v$NEW"

          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "::notice::bumped $OLD -> $NEW, committed to $BRANCH and tagged v$NEW"

      - name: Resolve target package dirs
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          PACKAGE: ${{ inputs.package }}      # empty on tag-push; a choice value on dispatch
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$PACKAGE" ] && [ "$PACKAGE" != "all" ]; then
            case "$PACKAGE" in
              bare_observe) DIRS="packages/bare-observe" ;;
              *) echo "unknown package: $PACKAGE" >&2; exit 1 ;;
            esac
          else
            DIRS="packages/bare-observe"
          fi
          echo "dirs=$DIRS" >> "$GITHUB_OUTPUT"
          echo "publishing: $DIRS"

      - name: Install build deps + publish (idempotent, per package)
        env:
          DIRS: ${{ steps.pick.outputs.dirs }}
          # No committed .npmrc: auth is setup-node's config reading NODE_AUTH_TOKEN.
          # Must be the npm AUTOMATION token, not the GitHub token.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -uo pipefail
          publish_pkg() {
            dir="$1"
            echo "::group::publish $dir"
            ( cd "$dir" && npm install --no-save ) || { echo "install failed for $dir"; echo "::endgroup::"; return 1; }
            # prepublishOnly builds dist/; publishConfig sets access:public for the scoped name.
            out=$( cd "$dir" && npm publish 2>&1 ); rc=$?
            echo "$out"
            if [ $rc -eq 0 ]; then
              echo "published $dir"
            elif echo "$out" | grep -qiE "cannot publish over|previously published|already exists|409"; then
              echo "version already on registry — skipping $dir (not an error)"
            else
              echo "publish failed for $dir"; echo "::endgroup::"; return 1
            fi
            echo "::endgroup::"
          }
          for d in $DIRS; do publish_pkg "$d" || exit 1; done

      - name: Create git tag + GitHub Release (manual dispatch, opt-in)
        if: github.event_name == 'workflow_dispatch' && inputs.create_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="$TAG_INPUT"
          if [ -z "$TAG" ]; then
            # After a bump, package.json on disk already carries the NEW version, so this picks it up.
            TAG="v$(jq -r .version packages/bare-observe/package.json)"   # jq is preinstalled on GitHub-hosted runners
          fi
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "refs/tags/$TAG"; then
            # The bump step already pushed this tag; fill in the missing Release rather than re-tag.
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "tag $TAG and its release already exist — nothing to do"
            else
              gh release create "$TAG" --title "$TAG" --verify-tag \
                --notes "Automated release via workflow_dispatch (package: ${{ inputs.package }}, bump: ${{ inputs.bump }})."
              echo "tag $TAG existed; created the missing GitHub Release for it"
            fi
          else
            # No bump happened, so tag the commit this run checked out.
            gh release create "$TAG" --title "$TAG" --target "$GITHUB_SHA" \
              --notes "Automated release via workflow_dispatch (package: ${{ inputs.package }})."
            echo "created tag + release $TAG"
          fi
