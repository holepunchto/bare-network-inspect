# CodeQL — advanced setup, replacing GitHub's "default setup" (the `automatic` configuration).
#
# Default setup keeps the language list in a UI checkbox that nothing in the repo records, and it
# had picked up java-kotlin and swift from packages/bare-probe/native/** — source-only code with no
# gradle or Xcode project, so those analyses can only return 0 results or fail for want of a build.
# Advanced setup puts the list here, and runs on pull_request (default setup did not).
#
# BEFORE MERGING: disable CodeQL default setup, or every alert is reported twice.
#   Settings → Advanced Security → Code scanning → CodeQL analysis → ⋯ → Disable

name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # weekly, so new queries reach existing code without waiting for a push
    - cron: '27 4 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # required to upload the SARIF results
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # DELIBERATELY EXCLUDED — java-kotlin, swift: packages/bare-probe/native/** is
        # source-only and uncompilable here, and CodeQL needs a build for those languages.
        # Add them back the day a real gradle/Xcode build exists, not before.
        language: [javascript-typescript, actions]

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      # No build step: both languages here are interpreted.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
